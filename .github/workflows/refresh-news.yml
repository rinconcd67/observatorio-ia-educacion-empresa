name: Proponer titulares de IA
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Comprobar configuración de la App
        env:
          APP_CLIENT_ID: ${{ vars.OBSERVATORY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OBSERVATORY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure OBSERVATORY_APP_CLIENT_ID y OBSERVATORY_APP_PRIVATE_KEY antes de activar esta rutina. Consulte docs/automation-app.md."
            exit 1
          fi
      - name: Crear token limitado de la App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.OBSERVATORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.OBSERVATORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar titulares oficiales
        run: npm run refresh:news
      - name: Construir y validar
        run: npm run build && npm run check && npm run check:publication
      - name: Cerrar propuestas y ramas antiguas de titulares
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEWS_BRANCH: automation/news-review
        run: |
          # Autolimpieza del modelo anterior (una propuesta y una rama automation/news-<run_id> por ejecución).
          # Tres condiciones acumulativas: rama con ese patrón, autor github-actions y propuesta del propio
          # repositorio (no fork). Así no toca la rama fija, ni propuestas de personas ni de Dependabot.
          gh pr list --state open --limit 200 --json number,headRefName,author,isCrossRepository \
            | jq -r '.[] | select(.isCrossRepository | not) | select(.author.login == "app/github-actions") | select(.headRefName | test("^automation/news-[0-9]+$")) | "\(.number) \(.headRefName)"' \
            | while read -r number branch; do
                gh pr close "$number" --delete-branch \
                  --comment "Sustituida por la propuesta única de titulares (rama ${NEWS_BRANCH}), que se actualiza en cada ejecución." \
                  || echo "aviso: no se pudo cerrar la propuesta #${number} (${branch})"
              done
      - name: Preparar propuesta de revisión
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEWS_BRANCH: automation/news-review
        run: |
          # Una sola propuesta abierta: la rama fija se reescribe desde main en cada ejecución.
          NEWS_UNCHANGED="$(node .github/scripts/news-equivalent.mjs HEAD data/processed/news.json)"
          if [ "$NEWS_UNCHANGED" = "true" ]; then exit 0; fi
          # Capture the expected remote OID explicitly: shallow checkout has no review tracking ref.
          REMOTE_OID="$(git ls-remote --heads origin "refs/heads/$NEWS_BRANCH" | cut -f1)"
          if [ -n "$REMOTE_OID" ]; then
            git fetch --depth=1 origin "$REMOTE_OID"
            # Equal headlines only permit reuse when the proposal also uses current main.
            NEWS_UNCHANGED="$(node .github/scripts/news-equivalent.mjs FETCH_HEAD data/processed/news.json HEAD)"
            if [ "$NEWS_UNCHANGED" = "true" ]; then exit 0; fi
          fi
          git config user.name "observatorio-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$NEWS_BRANCH"
          git add data/processed/news.json dashboard/index.html dashboard/en/index.html
          git commit -m "news: actualizar titulares oficiales de IA"
          bash .github/scripts/push-review-branch.sh "$NEWS_BRANCH" "$REMOTE_OID"
          PR_BODY="Titulares RSS oficiales al $(date -u +%Y-%m-%d), con fuente, fecha y estado de consulta. Esta propuesta se reescribe en cada ejecución; siempre contiene la versión más reciente. Requiere revisión antes de publicar."
          PR_NUMBER="$(gh pr list --head "$NEWS_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body "$PR_BODY"
          else
            gh pr create --base main --head "$NEWS_BRANCH" --title "news: revisión de titulares de IA" --body "$PR_BODY"
          fi
      - name: Verificar CI nativo del PR actual
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/news-review
        run: bash .github/scripts/check-pr-review.sh
      - name: Integrar propuesta validada en main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEWS_BRANCH: automation/news-review
        run: |
          PR_NUMBER="$(gh pr list --head "$NEWS_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --merge --delete-branch
          fi
