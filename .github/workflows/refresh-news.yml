name: Proponer titulares de IA
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar titulares oficiales
        run: npm run refresh:news
      - name: Construir y validar
        run: npm run build && npm run check && npm run check:publication
      - name: Cerrar propuestas y ramas antiguas de titulares
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS_BRANCH: automation/news-review
        run: |
          # Autolimpieza del modelo anterior (una propuesta y una rama automation/news-<run_id> por ejecución).
          # Tres condiciones acumulativas: rama con ese patrón, autor github-actions y propuesta del propio
          # repositorio (no fork). Así no toca la rama fija, ni propuestas de personas ni de Dependabot.
          gh pr list --state open --limit 200 --json number,headRefName,author,isCrossRepository \
            | jq -r '.[] | select(.isCrossRepository | not) | select(.author.login == "app/github-actions") | select(.headRefName | test("^automation/news-[0-9]+$")) | "\(.number) \(.headRefName)"' \
            | while read -r number branch; do
                gh pr close "$number" --delete-branch \
                  --comment "Sustituida por la propuesta única de titulares (rama ${NEWS_BRANCH}), que se actualiza en cada ejecución." \
                  || echo "aviso: no se pudo cerrar la propuesta #${number} (${branch})"
              done
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' \
            | { grep -E '^automation/news-[0-9]+$' || true; } \
            | while read -r branch; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null \
                  && echo "rama borrada: ${branch}" \
                  || echo "aviso: no se pudo borrar la rama ${branch}"
              done
      - name: Preparar propuesta de revisión
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS_BRANCH: automation/news-review
        run: |
          # Una sola propuesta abierta: la rama fija se reescribe desde main en cada ejecución.
          if git diff --quiet -- data/processed/news.json; then exit 0; fi
          if git fetch origin "$NEWS_BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- data/processed/news.json; then exit 0; fi
          git config user.name "observatorio-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$NEWS_BRANCH"
          git add data/processed/news.json dashboard/index.html dashboard/en/index.html
          git commit -m "news: actualizar titulares oficiales de IA"
          git push --force origin "$NEWS_BRANCH"
          PR_BODY="Titulares RSS oficiales al $(date -u +%Y-%m-%d), con fuente, fecha y estado de consulta. Esta propuesta se reescribe en cada ejecución; siempre contiene la versión más reciente. Requiere revisión antes de publicar."
          PR_NUMBER="$(gh pr list --head "$NEWS_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body "$PR_BODY"
          else
            gh pr create --base main --head "$NEWS_BRANCH" --title "news: revisión de titulares de IA" --body "$PR_BODY"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref "$NEWS_BRANCH"
          RUN_STATUS=""
          RUN_CONCLUSION=""
          RUN_URL=""
          for attempt in {1..30}; do
            RUN_JSON="$(gh run list --workflow ci.yml --branch "$NEWS_BRANCH" --event workflow_dispatch --json databaseId,headSha,status,conclusion,url --limit 10 | jq -c --arg head "$HEAD_SHA" '[.[] | select(.headSha == $head)] | first // {}')"
            RUN_STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status // empty')"
            RUN_CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"
            RUN_URL="$(printf '%s' "$RUN_JSON" | jq -r '.url // empty')"
            if [ "$RUN_STATUS" = "completed" ]; then break; fi
            sleep 10
          done
          if [ "$RUN_STATUS" != "completed" ]; then
            RUN_CONCLUSION="failure"
            RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
          fi
          CHECK_CONCLUSION="$RUN_CONCLUSION"
          if [ "$CHECK_CONCLUSION" != "success" ]; then CHECK_CONCLUSION="failure"; fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="validate" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CHECK_CONCLUSION" \
            -f details_url="$RUN_URL" \
            -f "output[title]=Integridad del observatorio" \
            -f "output[summary]=Validación obligatoria ejecutada por workflow_dispatch sobre ${HEAD_SHA}."
          test "$RUN_CONCLUSION" = "success"
