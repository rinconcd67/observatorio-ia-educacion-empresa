name: Proponer actualización de datos

on:
  schedule:
    - cron: "15 10 1 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Comprobar configuración de la App
        env:
          APP_CLIENT_ID: ${{ vars.OBSERVATORY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OBSERVATORY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure OBSERVATORY_APP_CLIENT_ID y OBSERVATORY_APP_PRIVATE_KEY antes de activar esta rutina. Consulte docs/automation-app.md."
            exit 1
          fi
      - name: Crear token limitado de la App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.OBSERVATORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.OBSERVATORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias verificadas
        run: npm ci

      - name: Conservar línea base
        run: cp data/baselines/published-snapshot.json /tmp/observatorio-snapshot-before.json

      - name: Fijar fecha efectiva de la ejecución
        run: echo "OBSERVATORY_AS_OF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Actualizar todas las fuentes
        id: refresh
        continue-on-error: true
        run: npm run refresh

      - name: Generar informe comparativo
        id: report
        continue-on-error: true
        run: >-
          npm run report:update --
          /tmp/observatorio-snapshot-before.json
          data/processed/snapshot.json
          reports/update-candidate.md

      - name: Validar actualización
        id: validation
        continue-on-error: true
        run: npm run check

      - name: Publicar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actualización-${{ github.run_id }}
          path: |
            reports/update-candidate.md
            data/processed/
            dashboard/artifact.json
          retention-days: 90
          if-no-files-found: warn

      - name: Aplicar puertas de aceptación
        if: steps.refresh.outcome == 'failure' || steps.report.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1

      - name: Detectar cambios del candidato y de su verificación
        id: changes
        run: |
          if git diff --quiet -- data/processed dashboard/artifact.json dashboard/index.html dashboard/en/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear rama de revisión
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: |
          git config user.name "observatorio-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add data/processed dashboard/artifact.json dashboard/index.html dashboard/en/index.html reports/update-candidate.md
          git commit -m "data: proponer actualización automática"
          git push origin "$BRANCH_NAME"

      - name: Abrir propuesta de actualización
        id: open-pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: >-
          gh pr create
          --base main
          --head "$BRANCH_NAME"
          --title "data: actualización automática del observatorio"
          --body-file reports/update-candidate.md

      - name: Registrar error al abrir la propuesta
        if: failure() && steps.open-pr.outcome == 'failure'
        env:
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: |
          echo "No se pudo abrir el PR. La ejecución permanece fallida; revise el error anterior." >> "$GITHUB_STEP_SUMMARY"
          echo "Comparación: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar CI nativo del PR actual
        if: steps.changes.outputs.changed == 'true' && steps.open-pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PR: 'true'
          REVIEW_BRANCH: automation/data-refresh-${{ github.run_id }}
        run: bash .github/scripts/check-pr-review.sh
