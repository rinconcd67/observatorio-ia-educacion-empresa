name: Proponer actualización de datos

on:
  schedule:
    - cron: "15 10 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias verificadas
        run: npm ci

      - name: Conservar línea base
        run: cp data/baselines/published-snapshot.json /tmp/observatorio-snapshot-before.json

      - name: Fijar fecha efectiva de la ejecución
        run: echo "OBSERVATORY_AS_OF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Actualizar todas las fuentes
        run: npm run refresh

      - name: Generar informe comparativo
        id: report
        continue-on-error: true
        run: >-
          npm run report:update --
          /tmp/observatorio-snapshot-before.json
          data/processed/snapshot.json
          reports/update-candidate.md

      - name: Validar actualización
        id: validation
        continue-on-error: true
        run: npm run check

      - name: Publicar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actualización-${{ github.run_id }}
          path: |
            reports/update-candidate.md
            data/processed/
            dashboard/artifact.json
          retention-days: 90
          if-no-files-found: warn

      - name: Aplicar puertas de aceptación
        if: steps.report.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1

      - name: Detectar cambios sustantivos
        id: changes
        run: |
          if git diff --quiet -- data/processed dashboard/artifact.json dashboard/index.html dashboard/en/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear rama de revisión
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: |
          git config user.name "observatorio-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add data/processed dashboard/artifact.json dashboard/index.html dashboard/en/index.html reports/update-candidate.md
          git commit -m "data: proponer actualización automática"
          git push origin "$BRANCH_NAME"

      - name: Abrir propuesta de actualización
        id: open-pr
        continue-on-error: true
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: >-
          gh pr create
          --base main
          --head "$BRANCH_NAME"
          --title "data: actualización automática del observatorio"
          --body-file reports/update-candidate.md

      - name: Registrar revisión manual
        if: steps.changes.outputs.changed == 'true' && steps.open-pr.outcome == 'failure'
        env:
          BRANCH_NAME: automation/data-refresh-${{ github.run_id }}
        run: |
          echo "### Actualización lista para revisión manual" >> "$GITHUB_STEP_SUMMARY"
          echo "La política del repositorio no permitió abrir el pull request automáticamente." >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir comparación y crear pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
