name: Integridad del observatorio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias verificadas
        run: npm ci

      - name: Construir sitio y artefactos
        run: npm run build

      - name: Ejecutar pruebas y validaciones
        run: npm run check

      - name: Comparar con la publicación verificada
        run: npm run check:publication

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verificar formato del diff
        run: git diff --check
