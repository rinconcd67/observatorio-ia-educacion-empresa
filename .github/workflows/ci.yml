name: Integridad del observatorio

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias verificadas
        run: npm ci

      - name: Construir sitio y artefactos
        run: npm run build

      - name: Ejecutar pruebas y validaciones
        run: npm run check

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verificar formato del diff
        run: git diff --check
